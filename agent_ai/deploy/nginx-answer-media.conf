# Add the upstream block to nginx's http {} context.
# Every node listed here MUST read the same shared figure storage. If files are
# node-local, use a single storage server or object storage instead.
upstream answer_media_backend {
    server 47.112.200.35:8000 max_fails=3 fail_timeout=30s;
    # Enable only after the new node mounts the same figures directory:
    # server 47.112.200.36:8000 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

# Add this location BEFORE the existing `location ^~ /references/ { ... }`
# block in the public HTTPS virtual host. Nginx selects this longer prefix for
# generated figures while other Wiki reference URLs continue to use port 8010.
location ^~ /references/figures/ {
    proxy_pass http://answer_media_backend/references/figures/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_cache_valid 200 1h;
    add_header Cache-Control "public, max-age=3600" always;
}
