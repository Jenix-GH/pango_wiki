# Include the upstream block in nginx's http {} context.
# Add or remove model nodes here; Java always calls one stable gateway URL.
upstream chat_backend {
    hash $http_x_session_id consistent;

    server 47.112.200.35:8000 max_fails=3 fail_timeout=30s;
    # server 47.112.200.36:8000 max_fails=3 fail_timeout=30s;
    # server 47.112.200.37:8000 max_fails=3 fail_timeout=30s;

    keepalive 64;
}

# Internal model gateway. Do not expose this port to the public network.
# Set DIALOGUE_URL=http://<nginx-private-ip>:8081/chat/ragflow-compatible
# on every Java backend instance.
server {
    listen 8081;
    server_name _;

    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location = /chat/ragflow-compatible {
        # Reject calls that did not pass through Java and have no routing key.
        if ($http_x_session_id = "") {
            return 400;
        }

        proxy_pass http://chat_backend/chat/ragflow-compatible;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Session-Id $http_x_session_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
        proxy_cache off;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
