# Public Nginx -> Java business backend.
#
# Streaming chat now passes through /dbServ/dialogue/stream-answer. The public
# proxy must not buffer this response, otherwise the model can finish and the
# answer can be persisted while Web/Mini Program clients still receive no
# progress frames.
location /dbServ/ {
    proxy_pass http://172.17.11.2:8080/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    proxy_cache off;
}
